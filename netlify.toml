# Netlify 配置
#
# 本仓库是纯静态的：index.html 自带全部 CSS/JS/字体/图片，不需要构建。
#
# ── 关于「不让辅助文件被公开」的正确做法 ──────────────────────────────
# 教训：Netlify 的 [build] ignore 字段**不能**用来排除发布文件（实测无效，
# .ps1 脚本照样被公开下载）。真正可靠的有两道：
#   1. 首选：让文件物理上不存在于发布目录里。辅助脚本已移到
#      D:\ai\my-website\tools\，发布目录只剩 index.html，从根上杜绝。
#   2. 兜底：下面的 redirects 规则，把这些路径直接打死。
# 两者都要有——只靠配置排除，早晚会出这种事。

[build]
  publish = "."
  command = ""

# 兜底规则：force = true 保证在静态文件之前生效。
# 注意 to 要指向一个真实存在的文件——发布目录里只有 index.html，
# 所以这里写 "/"，不要写 "/404.html"（那个文件不存在）。
[[redirects]]
  from = "/*.ps1"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
